<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Seguro MB WAY</title>
    
    <!-- CSS Incorporado: Interface Limpa, Moderna e Focada em Conversão -->
    <style>
        :root {
            --mbway-pink: #ff007f;
            --mbway-hover: #e00070;
            --dark: #24292f;
            --bg: #f6f8fa;
            --border: #d0d7de;
            --success: #1a7f37;
            --success-bg: #dafbe1;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .checkout-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 12px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .order-summary {
            background: #fafafa;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-summary span {
            font-size: 14px;
            color: #57606a;
        }

        .order-summary .price {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .phone-input-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #ffffff;
            padding: 0 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .phone-input-wrapper:focus-within {
            border-color: var(--mbway-pink);
            box-shadow: 0 0 0 3px rgba(255, 0, 127, 0.15);
        }

        .prefix {
            font-size: 15px;
            font-weight: 600;
            color: #57606a;
            margin-right: 8px;
            user-select: none;
        }

        input[type="tel"] {
            border: none;
            outline: none;
            width: 100%;
            padding: 12px 0;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .btn-mbway {
            background-color: var(--mbway-pink);
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-mbway:hover { background-color: var(--mbway-hover); }
        .btn-mbway:active { transform: scale(0.98); }

        .status-section {
            margin-top: 25px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .status-box {
            background-color: #e8f4fd;
            border: 1px solid #b3dbf7;
            padding: 15px;
            border-radius: 6px;
            font-size: 14px;
            color: #0366d6;
            line-height: 1.5;
            text-align: center;
        }

        .status-box.success {
            background-color: var(--success-bg);
            border-color: #a5d6a7;
            color: var(--success);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="checkout-card">
    <div class="header">
        <h1>Pagamento via MB WAY</h1>
    </div>

    <!-- Resumo do Valor -->
    <div class="order-summary">
        <span>Total a pagar:</span>
        <span class="price">25,00 €</span>
    </div>

    <!-- Formulário Simplificado (Sem Chaves) -->
    <div class="form-group">
        <label for="phoneNumber">Número de Telemóvel:</label>
        <div class="phone-input-wrapper">
            <span class="prefix">+351</span>
            <input type="tel" id="phoneNumber" maxlength="9" placeholder="9xxxxxxxx" pattern="[2,9][0-9]{8}" required>
        </div>
    </div>

    <button class="btn-mbway" onclick="iniciarPagamentoMBWay()">
        Pagar com MB WAY
    </button>

    <!-- Estado da Transação em Tempo Real -->
    <div class="status-section" id="statusSection">
        <div class="status-box" id="statusMessage"></div>
    </div>
</div>

<script>
    async function iniciarPagamentoMBWay() {
        const telefone = document.getElementById('phoneNumber').value.trim();
        const statusSecao = document.getElementById('statusSection');
        const statusMsg = document.getElementById('statusMessage');

        // Validação básica do número português (9 dígitos)
        if (!/^[29][0-9]{8}$/.test(telefone)) {
            alert("Por favor, introduza um número de telemóvel MB WAY válido (9 dígitos).");
            return;
        }

        // Mostrar indicador de processamento
        statusSecao.style.display = "block";
        statusMsg.className = "status-box";
        statusMsg.innerHTML = "<strong>A enviar notificação...</strong><br>Abra a aplicação MB WAY no seu telemóvel para autorizar o pagamento.";

        try {
            /* 
               NOTA DE INTEGRAÇÃO:
               Em produção, o seu frontend envia apenas o telemóvel e valor para o SEU servidor backend.
               O seu servidor faz o pedido seguro (com chaves escondidas lá) para a Easypay, IFTHENPAY, SIBS, etc.
            */
            
            // Simulação da resposta da API de Pagamentos
            await new Promise(resolve => setTimeout(resolve, 4000)); // Espera 4 segundos simulando a aprovação do utilizador

            // Sucesso na transação
            statusMsg.className = "status-box success";
            statusMsg.innerHTML = "<strong>✓ Pagamento Confirmado!</strong><br>Obrigado pela sua compra. O seu pedido foi processado.";

        } catch (erro) {
            statusMsg.className = "status-box";
            statusMsg.style.borderColor = "#cf222e";
            statusMsg.style.color = "#cf222e";
            statusMsg.style.backgroundColor = "#ffebe9";
            statusMsg.innerHTML = "<strong>Erro no pagamento.</strong><br>A operação foi recusada ou expirou o tempo limite.";
        }
    }
</script>

</body>
</html>
